name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests JavaScript (calculs)
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Outils Python
        run: pip install pytest ruff
      - name: Lint Python
        run: ruff check scripts tests
      - name: Tests Python (script de données)
        run: pytest -q tests
